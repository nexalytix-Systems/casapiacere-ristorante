<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Casa Piacere Ristorante - Chatbot Version</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Montserrat:wght@400;600&family=Cormorant+Garamond:wght@600&display=swap" rel="stylesheet">
    
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        :root {
            --azul-profundo: #0a1f3f;
            --azul-claro: #1a3a5c;
            --ouro: #e8d5a8;
            --ouro-claro: #f5e6d3;
            --ouro-escuro: #d4af85;
            --fundo-escuro: #0f1e2e;
            --branco: #fafaf8;
        }

        body {
            font-family: 'Montserrat', sans-serif;
            line-height: 1.6;
            color: #333;
            background: var(--branco);
        }

        /* CHATBOT WIDGET */
        #chatbot-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 380px;
            height: 500px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 5px 40px rgba(0, 0, 0, 0.16);
            display: flex;
            flex-direction: column;
            z-index: 999;
            font-family: 'Montserrat', sans-serif;
        }

        #chatbot-header {
            background: linear-gradient(135deg, var(--azul-profundo) 0%, var(--azul-claro) 100%);
            color: var(--ouro);
            padding: 20px;
            border-radius: 12px 12px 0 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .chatbot-title {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 700;
        }

        .chatbot-subtitle {
            font-size: 12px;
            color: var(--ouro-claro);
            margin-top: 5px;
        }

        #chatbot-close {
            background: none;
            border: none;
            color: var(--ouro);
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        #chatbot-close:hover {
            color: var(--ouro-claro);
        }

        #chatbot-messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f9f9f9;
        }

        .message {
            margin-bottom: 15px;
            animation: slideIn 0.3s ease;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .message.bot {
            display: flex;
            gap: 10px;
        }

        .message.user {
            display: flex;
            justify-content: flex-end;
        }

        .message-content {
            max-width: 70%;
            padding: 12px 16px;
            border-radius: 8px;
            word-wrap: break-word;
            line-height: 1.4;
            font-size: 14px;
        }

        .message.bot .message-content {
            background: var(--azul-profundo);
            color: var(--ouro);
            border-radius: 8px 8px 8px 0;
        }

        .message.user .message-content {
            background: var(--ouro-claro);
            color: var(--azul-profundo);
            border-radius: 8px 8px 0 8px;
        }

        .bot-avatar {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            background: var(--azul-profundo);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            flex-shrink: 0;
        }

        .message-action {
            display: inline-block;
            background: var(--ouro);
            color: var(--azul-profundo);
            padding: 8px 12px;
            border-radius: 4px;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            margin-top: 8px;
            cursor: pointer;
            border: none;
        }

        .message-action:hover {
            background: var(--ouro-escuro);
        }

        #chatbot-input-area {
            padding: 15px;
            border-top: 1px solid #e0e0e0;
            display: flex;
            gap: 10px;
        }

        #chatbot-input {
            flex: 1;
            border: 1px solid #ddd;
            border-radius: 20px;
            padding: 10px 15px;
            font-size: 14px;
            font-family: 'Montserrat', sans-serif;
        }

        #chatbot-input:focus {
            outline: none;
            border-color: var(--ouro);
            background: #fafaf8;
        }

        #chatbot-send {
            background: var(--ouro);
            color: var(--azul-profundo);
            border: none;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            cursor: pointer;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        #chatbot-send:hover {
            background: var(--ouro-escuro);
        }

        /* BOTÃO FLUTUANTE (quando chatbot fechado) */
        #chatbot-toggle {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--azul-profundo) 0%, var(--azul-claro) 100%);
            color: var(--ouro);
            border: none;
            cursor: pointer;
            font-size: 28px;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 12px rgba(10, 31, 63, 0.3);
            z-index: 998;
        }

        #chatbot-toggle:hover {
            transform: scale(1.1);
            box-shadow: 0 6px 20px rgba(10, 31, 63, 0.4);
        }

        /* Responsividade */
        @media (max-width: 600px) {
            #chatbot-widget {
                width: calc(100% - 40px);
                height: 450px;
                max-height: 90vh;
            }

            .message-content {
                max-width: 85%;
            }
        }

        /* Scrollbar customizado */
        #chatbot-messages::-webkit-scrollbar {
            width: 6px;
        }

        #chatbot-messages::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        #chatbot-messages::-webkit-scrollbar-thumb {
            background: var(--ouro);
            border-radius: 3px;
        }

        #chatbot-messages::-webkit-scrollbar-thumb:hover {
            background: var(--ouro-escuro);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>

    <!-- CHATBOT WIDGET -->
    <div id="chatbot-widget" class="hidden">
        <div id="chatbot-header">
            <div>
                <div class="chatbot-title">Casa Piacere</div>
                <div class="chatbot-subtitle">Sempre pronto para ajudar</div>
            </div>
            <button id="chatbot-close">✕</button>
        </div>
        
        <div id="chatbot-messages"></div>
        
        <div id="chatbot-input-area">
            <input type="text" id="chatbot-input" placeholder="Digite sua mensagem...">
            <button id="chatbot-send">→</button>
        </div>
    </div>

    <!-- BOTÃO FLUTUANTE (para abrir chatbot) -->
    <button id="chatbot-toggle">💬</button>

    <script>
        // Base de Conhecimento do Chatbot
        const knowledgeBase = {
            // Horários
            'horario|aberto|funciona|quando|hora': {
                response: 'Casa Piacere funciona:\n\n🕕 Terça a Quinta: 18h às 23h30\n🕕 Sexta a Sábado: 18h até 00h\n🕕 Domingo: 18h às 23h30\n\n❌ Fechado segunda-feira\n\nDeseja fazer uma reserva?',
                action: { text: 'Fazer Reserva', url: 'https://nuvemenu.com.br/reservation/casa-piacere' }
            },
            
            // Cardápio e Pratos
            'cardapio|menu|prato|massa|comida|prato': {
                response: 'Nosso cardápio inclui:\n\n🍝 Massas Artesanais\n• Carbonara (R$ 72)\n• Tagliatelle al Ragù (R$ 76)\n• Fettuccine Quattro Formaggi (R$ 74)\n\n🦞 Frutos do Mar\n• Tagliatelle com Filé (R$ 98)\n• Branzino (R$ 92)\n\n🍰 Sobremesas\n• Tiramisù, Panna Cotta, Cannolo\n\nVer cardápio completo?',
                action: { text: 'Ver Cardápio', url: '#cardapio' }
            },
            
            // Massa Fresca
            'massa fresca|artesanal|faz massa': {
                response: '✨ Sim! Todas as nossas massas são 100% artesanais.\n\nO Chef Geraldo Horta prepara diariamente usando receitas autênticas italianas e ingredientes frescos de qualidade premium.\n\nPraatos mais populares:\n• Spaghetti alla Carbonara\n• Tagliatelle al Ragù\n• Fettuccine Quattro Formaggi\n\nQuer fazer uma reserva?',
                action: { text: 'Reservar Mesa', url: 'https://nuvemenu.com.br/reservation/casa-piacere' }
            },
            
            // Reservas
            'reserva|mesa|table|book|agendar|reservar': {
                response: '📅 Ótimo! Você pode fazer reserva de 3 formas:\n\n1️⃣ Online: Sistema Nuvemenu\n2️⃣ WhatsApp: (31) 98684-8128\n3️⃣ Telefone: (31) 98684-8128\n\nQual prefere?',
                action: { text: 'Reservar Online', url: 'https://nuvemenu.com.br/reservation/casa-piacere' }
            },
            
            // Contato
            'contato|telefone|email|whatsapp|fone|celular': {
                response: '📞 Entre em contato:\n\n📱 WhatsApp: (31) 98684-8128\n☎️ Telefone: (31) 98684-8128\n📧 Email: contato@casapiacere.com.br\n📍 Rua Bernardo Guimarães, 577 - Funcionários, BH\n\nEstamos 24/7 para você!',
                action: { text: 'Enviar WhatsApp', url: 'https://wa.me/5531986848128' }
            },
            
            // Chef
            'chef|geraldo|horta|cozinha|chef': {
                response: '👨‍🍳 Conheça nosso Chef!\n\nChef Geraldo Horta, carinhosamente conhecido como "Geraldinho do Conceito da Carne", traz mais de 20 anos de experiência culinária.\n\nEspecialista em:\n✓ Massas artesanais\n✓ Risotos cremosos\n✓ Frutos do mar frescos\n✓ Autêntica culinária italiana\n\nSua paixão por qualidade e tradição se reflete em cada prato.',
                action: null
            },
            
            // Ambiente
            'ambiente|lugar|experiencia|atmosfera': {
                response: '✨ Casa Piacere oferece:\n\n🏛️ Ambiente elegante e acolhedor\n🎨 Design sofisticado (azul e ouro)\n👨‍🍳 Cozinha aberta (ver o magic acontecer)\n🍽️ Mesas confortáveis\n🎵 Música ambiente relaxante\n\nPerfecto para:\n💑 Jantares românticos\n👨‍👩‍👧‍👦 Reuniões familiares\n🤝 Encontros profissionais\n🎉 Celebrações especiais\n\nQuer experimentar?',
                action: { text: 'Fazer Reserva', url: 'https://nuvemenu.com.br/reservation/casa-piacere' }
            },
            
            // Avaliações
            'avaliacoes|reviews|opinoes|criticas': {
                response: '⭐⭐⭐⭐⭐ 4.9/5 de 150+ clientes\n\n"Melhor restaurante italiano de BH!" - Maria S.\n"Chef Geraldo é um gênio!" - João P.\n"Massas perfeitas, ambiente impecável" - Ana T.\n\nVer mais avaliações no site.\n\nSua opinião também é valiosa!',
                action: { text: 'Deixar Avaliação', url: '#avaliacoes' }
            },
            
            // Preços
            'preco|valor|quanto custa|caro|barato': {
                response: '💰 Preços Casa Piacere:\n\n🍝 Massas: R$ 72-98\n🦞 Frutos do Mar: R$ 84-104\n🥩 Carnes: R$ 98-104\n🍰 Sobremesas: R$ 22-28\n\nExcelente relação custo-benefício para qualidade premium!\n\nDeseja ver o cardápio completo?',
                action: { text: 'Ver Cardápio', url: '#cardapio' }
            },

            // Estacionamento
            'estacionamento|vaga|carro|garagem': {
                response: '🅿️ Localização privilegiada:\n\n📍 Rua Bernardo Guimarães, 577\n🅿️ Estacionamento na rua (gratuito)\n🚕 Fácil acesso por Uber/99\n\nPara mais informações:\n📱 (31) 98684-8128',
                action: { text: 'Ir para Google Maps', url: 'https://maps.google.com' }
            },

            // Promocoes
            'promocao|promoção|desconto|oferta|cupom': {
                response: '🎉 Fique atento às nossas promoções!\n\n✨ Happy Hour (em breve)\n🎁 Programa de Fidelização\n🎂 Desconto de Aniversário\n\nSiga nosso Instagram para não perder:\n📸 @casapiacere\n\nQuer ser notificado de promoções?',
                action: { text: 'Seguir no Instagram', url: 'https://instagram.com/casapiacere' }
            },

            // Delivery
            'delivery|entrega|levar|casa': {
                response: '🚚 Atualmente, Casa Piacere funciona como:\n\n✓ Presencial (Jantar no local)\n✓ Reservas via NuveMenu\n\n📝 Delivery: Em breve!\n\nPor enquanto, visite-nos e aproveite a experiência única no nosso ambiente.\n\n📱 Quer fazer uma reserva?',
                action: { text: 'Reservar Mesa', url: 'https://nuvemenu.com.br/reservation/casa-piacere' }
            },

            // Default
            'default': {
                response: 'Olá! 👋 Não entendi perfeitamente sua pergunta. Posso ajudar com:\n\n• Horário de funcionamento\n• Cardápio e pratos\n• Fazer reserva\n• Informações de contato\n• Chef e experiência\n• Localização\n\nOu prefere falar com um atendente?',
                action: { text: 'Falar com Alguém', url: 'https://wa.me/5531986848128' }
            }
        };

        // Elementos do DOM
        const widget = document.getElementById('chatbot-widget');
        const toggle = document.getElementById('chatbot-toggle');
        const closeBtn = document.getElementById('chatbot-close');
        const messagesDiv = document.getElementById('chatbot-messages');
        const inputField = document.getElementById('chatbot-input');
        const sendBtn = document.getElementById('chatbot-send');

        // Controle do widget
        toggle.addEventListener('click', () => {
            widget.classList.remove('hidden');
            toggle.classList.add('hidden');
            inputField.focus();
            sendGreeting();
        });

        closeBtn.addEventListener('click', () => {
            widget.classList.add('hidden');
            toggle.classList.remove('hidden');
        });

        // Enviar mensagem
        sendBtn.addEventListener('click', sendMessage);
        inputField.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        function sendMessage() {
            const text = inputField.value.trim();
            if (!text) return;

            // Mostrar mensagem do usuário
            addMessage(text, 'user');
            inputField.value = '';

            // Processar resposta
            setTimeout(() => {
                const response = findResponse(text);
                addMessage(response.response, 'bot', response.action);
            }, 500);
        }

        function addMessage(text, sender, action = null) {
            const msgDiv = document.createElement('div');
            msgDiv.className = `message ${sender}`;

            if (sender === 'bot') {
                msgDiv.innerHTML = `
                    <div class="bot-avatar">🤖</div>
                    <div>
                        <div class="message-content">${text}</div>
                        ${action ? `<a href="${action.url}" class="message-action" target="_blank">${action.text}</a>` : ''}
                    </div>
                `;
            } else {
                msgDiv.innerHTML = `<div class="message-content">${text}</div>`;
            }

            messagesDiv.appendChild(msgDiv);
            messagesDiv.scrollTop = messagesDiv.scrollHeight;
        }

        function findResponse(userText) {
            const text = userText.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
            
            for (const [keywords, data] of Object.entries(knowledgeBase)) {
                if (keywords === 'default') continue;
                
                const keywordList = keywords.split('|');
                if (keywordList.some(kw => text.includes(kw))) {
                    return data;
                }
            }

            return knowledgeBase.default;
        }

        function sendGreeting() {
            addMessage('Olá! 👋 Bem-vindo à Casa Piacere Ristorante!\n\nSou seu assistente virtual. Posso ajudar com:\n\n• Horário de funcionamento\n• Cardápio\n• Fazer reserva\n• Informações de contato\n\nComo posso ajudar?', 'bot');
        }
    </script>

</body>
</html>
